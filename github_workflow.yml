name: FunPay Monitor

on:
  schedule:
    - cron: '0 */2 * * *'  # Запуск каждые 2 часа (в 0 минут)
  workflow_dispatch:      # Возможность запуска вручную кнопку

jobs:
  check_funpay:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Разрешаем сохранять файл seen_ids.txt обратно в репозиторий

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py --once

      - name: Commit and Push seen_ids.txt
        # Сохраняем список просмотренных товаров, чтобы не было повторов
        run: |
          git config --global user.name 'FunPay Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add seen_ids.txt
          git commit -m "Update seen_ids.txt" || exit 0  # Если изменений нет, не падаем
          git push
