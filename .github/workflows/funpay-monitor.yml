name: FunPay Monitor

on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch:

concurrency:
  group: funpay-monitor
  cancel-in-progress: false

jobs:
  check_funpay:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Cooldown check
        id: cooldown
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          LAST_RUN=$(curl -s -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=success&per_page=2" \
            | jq -r '.workflow_runs[0].created_at // empty')
          if [ -n "$LAST_RUN" ]; then
            LAST_EPOCH=$(date -d "$LAST_RUN" +%s)
            NOW=$(date +%s)
            DIFF=$((NOW - LAST_EPOCH))
            echo "Last successful run was ${DIFF}s ago"
            if [ $DIFF -lt 5400 ]; then
              echo "Too soon (< 90 min), skipping"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Checkout code
        if: steps.cooldown.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cooldown.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor once
        if: steps.cooldown.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python monitor.py --once

      - name: Commit runtime state
        if: steps.cooldown.outputs.skip != 'true'
        run: |
          git config --global user.name "FunPay Bot"
          git config --global user.email "bot@noreply.github.com"
          git add seen_ids.txt sent_offers.json banned_ids.txt price_history.db config.json
          git commit -m "Update monitor state" || exit 0
          git push

      - name: Trigger next run
        if: steps.cooldown.outputs.skip != 'true'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "Scheduling next run via workflow_dispatch..."
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/funpay-monitor.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Next run triggered"
