name: FunPay Monitor

on:
  schedule:
    - cron: "5 */1 * * *"
  workflow_dispatch:

jobs:
  check_funpay:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monitor once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python monitor.py --once

      - name: Commit runtime state
        run: |
          git config --global user.name "FunPay Bot"
          git config --global user.email "bot@noreply.github.com"
          git add seen_ids.txt sent_offers.json banned_ids.txt price_history.db config.json
          git commit -m "Update monitor state" || exit 0
          git push
